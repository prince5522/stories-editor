<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts</title><link rel="stylesheet" href="css/whatsapp-shell.css"></head><body><header class="topbar"><strong>Channel Studio</strong><div class="topbar-actions"></div></header><main><h1>Accounts</h1><p>Add and switch local profiles on this device. These are profile labels, not separate secure sign-ins.</p><form id="f"><input id="n" placeholder="Profile name" required><input id="e" placeholder="Email or label"><button>Add account</button></form><div id="list"></div></main><script>const k='cs_local_profiles',g=()=>JSON.parse(localStorage.getItem(k)||'[]'),s=a=>localStorage.setItem(k,JSON.stringify(a));function d(){let a=g();list.innerHTML=a.map((x,i)=>'<p>'+x.name.replace(/[&<>]/g,'')+' '+(x.active?'(Active)':'')+' <button data-i="'+i+'">Switch</button></p>').join('')}f.onsubmit=e=>{e.preventDefault();let a=g();a.forEach(x=>x.active=false);a.push({name:n.value,email:e.value,active:true});s(a);d()};list.onclick=e=>{if(e.target.dataset.i!==undefined){let a=g();a.forEach((x,i)=>x.active=i==e.target.dataset.i);s(a);d()}};d()</script><script src="js/whatsapp-shell.js"></script></body></html>
