
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101b1a">

  <title>Sign in — Story Studio</title>

  <!-- Login-only styling. Does not load or modify the app-wide CSS. -->
  <style>
    :root {
      color-scheme: dark;
      --login-bg: #101716;
      --login-card: rgba(37, 49, 47, .88);
      --login-input: rgba(9, 19, 18, .62);
      --login-teal: #35d5c2;
      --login-text: #f1f7f5;
      --login-muted: #9aaea9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 25px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(31, 164, 143, .13), transparent 48%),
        radial-gradient(ellipse at 10% 90%, rgba(19, 94, 83, .15), transparent 40%),
        linear-gradient(145deg, #0b1211, #14201e 55%, #0b1211);
      color: var(--login-text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .login-shell {
      width: min(100%, 440px);
      animation: shell-arrive .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .brand-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 28px;
      color: #a9c9c1;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand-orb {
      width: 12px;
      height: 12px;
      border: 2px solid var(--login-teal);
      border-radius: 50%;
      box-shadow: 0 0 13px rgba(53, 213, 194, .7);
      position: relative;
    }

    .brand-orb::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--login-teal);
    }

    .login-heading {
      margin: 0 0 27px;
      text-align: center;
    }

    .login-heading .eyebrow {
      margin: 0 0 9px;
      color: #6bbaa9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .login-heading h1 {
      margin: 0;
      font-size: clamp(39px, 10vw, 53px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -2.8px;
    }

    .login-heading h1 span {
      display: block;
      margin-top: 4px;
      color: var(--login-teal);
    }

    .login-card {
      position: relative;
      padding: 27px 25px 23px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.105);
      border-radius: 28px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.105),
        rgba(255,255,255,.035)
      ), var(--login-card);
      box-shadow:
        0 25px 75px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.09);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -125px;
      right: -80px;
      border-radius: 50%;
      background: rgba(53, 213, 194, .13);
      filter: blur(25px);
      pointer-events: none;
    }

    .card-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
      color: #a9c9c1;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .card-brand-mark {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(53,213,194,.8);
      border-radius: 50%;
      color: var(--login-teal);
      font-size: 12px;
      box-shadow: 0 0 13px rgba(53,213,194,.18);
    }

    .form-heading {
      margin: 0 0 6px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .form-description {
      margin: 0 0 23px;
      color: var(--login-muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .field {
      margin-bottom: 19px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: #a9c9c1;
      font-size: 12px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      height: 53px;
      padding: 0 15px 0 43px;
      border: 1px solid rgba(53,213,194,.27);
      border-radius: 14px;
      outline: none;
      background: var(--login-input);
      color: var(--login-text);
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .field input::placeholder {
      color: #71817c;
    }

    .field input:focus {
      border-color: var(--login-teal);
      background: rgba(8, 23, 21, .82);
      box-shadow: 0 0 0 3px rgba(53,213,194,.10);
    }

    .field-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #7b9d94;
      font-size: 16px;
      pointer-events: none;
    }

    .password-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .password-row .field-label {
      margin: 0;
    }

    .text-action {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--login-teal);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      padding: 7px;
      border: 0;
      background: transparent;
      color: #8ba69e;
      cursor: pointer;
    }

    .password-field input {
      padding-right: 49px;
    }

    .login-message {
      display: none;
      margin: 4px 0 15px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 110, 110, .2);
      border-radius: 11px;
      background: rgba(180, 55, 55, .12);
      color: #ffaaaa;
      font-size: 12px;
      line-height: 1.5;
    }

    .login-message.success {
      border-color: rgba(53,213,194,.2);
      background: rgba(53,213,194,.09);
      color: #8ce8d8;
    }

    .runway {
      position: relative;
      min-height: 70px;
      margin: 10px 0 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 17px;
      background: rgba(5, 14, 13, .48);
    }

    .runway::before {
      content: "";
      position: absolute;
      width: 76%;
      height: 34px;
      right: 9%;
      border: 1px dashed rgba(53,213,194,.38);
      border-radius: 30px;
      transform: skewX(-18deg);
    }

    .submit-button {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 53px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 15px;
      background: linear-gradient(100deg, #263633, #1c3934 55%, #14665b);
      box-shadow:
        0 9px 22px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.12);
      color: white;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
      transition: transform .25s, box-shadow .25s, filter .25s;
    }

    .submit-button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(20, 180, 158, .2);
      filter: brightness(1.12);
    }

    .submit-button:not(:disabled):active {
      transform: scale(.98);
    }

    .submit-button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .runway.loading .submit-button {
      animation: runway-move .7s ease-in-out infinite alternate;
    }

    .login-hint {
      margin: 11px 0 0;
      color: #8fa29c;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .login-hint strong {
      color: #c5d8d1;
    }

    .account-switch {
      margin: 23px 0 0;
      padding-top: 19px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #9aada6;
      font-size: 12px;
      text-align: center;
    }

    .account-switch button {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--login-teal);
      font-weight: 800;
      cursor: pointer;
    }

    .login-footer {
      margin: 22px 0 0;
      color: #61766e;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 2px;
      text-align: center;
    }

    @keyframes shell-arrive {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes runway-move {
      from { transform: translateX(-3px); }
      to { transform: translateX(3px); }
    }

    @media (max-width: 380px) {
      body {
        padding: 20px 13px;
      }

      .login-card {
        padding: 23px 19px 20px;
        border-radius: 24px;
      }

      .login-heading h1 {
        font-size: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="login-shell">

    <div class="brand-line">
      <span class="brand-orb"></span>
      STORY STUDIO
    </div>

    <header class="login-heading">
      <p class="eyebrow">YOUR CREATOR SPACE</p>
      <h1>
        Welcome<br>
        <span>Back.</span>
      </h1>
    </header>

    <section class="login-card">
      <div class="card-brand">
        <span class="card-brand-mark">✦</span>
        STORY STUDIO
      </div>

      <h2 class="form-heading" id="formHeading">Sign in</h2>
      <p class="form-description" id="formDescription">
        Welcome back. Sign in to continue creating and managing your stories.
      </p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true">✉</span>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
            >
          </div>
        </div>

        <div class="field">
          <div class="password-row">
            <label class="field-label" for="password">Password</label>
            <button class="text-action" id="forgotPassword" type="button">
              Forgot?
            </button>
          </div>

          <div class="input-wrap password-field">
            <span class="field-icon" aria-hidden="true">▣</span>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              autocomplete="current-password"
              minlength="8"
              required
            >
            <button
              class="password-toggle"
              id="togglePassword"
              type="button"
              aria-label="Show password"
            >◉</button>
          </div>
        </div>

        <div class="login-message" id="loginMessage" role="status"></div>

        <div class="runway" id="runway">
          <button class="submit-button" id="submitButton" type="submit">
            Log in <span aria-hidden="true">↗</span>
          </button>
        </div>
      </form>

      <p class="login-hint">
        <strong>Two fields.</strong> One creator space.<br>
        Your stories and tools are waiting.
      </p>

      <p class="account-switch" id="accountSwitch">
        No account yet?
        <button id="switchMode" type="button">Create one</button>
      </p>
    </section>

    <p class="login-footer">
      CREATE · ORGANISE · PLAN · SHARE
    </p>
  </main>

  <!-- Authentication logic is kept in its own JavaScript file. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
